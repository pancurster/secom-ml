[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secom-ml"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "ipykernel",
    "matplotlib",
    "numpy==2.5.4",
    "openpyxl>=3.1.5",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
