[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secom-ml"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "ipykernel",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas>=3.0.0",
    "scikit-learn",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pylint"
]

[tool.setuptools.packages.find]
where = ["src"]
